<!DOCTYPE html>
<html>
<head>
  <title>Flutter App Placeholder</title>
</head>
<body>
  <!-- Flutter UI will mount here -->

    <!-- mForceOS1 Orbital Protocol -->
    <script>
        window.addEventListener('mforce-theme-change', (e) => {
            if (e.detail && e.detail.theme === 'solar') {
                document.body.classList.add('solar-theme');
                document.body.classList.remove('lunar-theme');
            } else {
                document.body.classList.add('lunar-theme');
                document.body.classList.remove('solar-theme');
            }
        });
    </script>
</body>

</html>
