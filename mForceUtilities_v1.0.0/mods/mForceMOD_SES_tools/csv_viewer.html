<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Viewer</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --danger-color: #f85149;
            --success-color: #238636;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .metadata {
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            gap: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: var(--border-color);
        }

        .accent-btn {
            background-color: var(--success-color);
            border-color: rgba(240, 246, 252, 0.1);
            color: white;
            font-weight: 500;
        }

        .accent-btn:hover {
            background-color: #2ea043;
        }

        /* Table Container */
        .table-container {
            flex: 1;
            overflow: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--surface-color);
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        thead {
            position: sticky;
            top: 0;
            background-color: var(--surface-color);
            z-index: 10;
        }

        th, td {
            padding: 10px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
            user-select: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        th:hover {
            color: var(--text-primary);
        }

        th.sort-asc::after {
            content: " ▲";
            font-size: 0.7em;
        }

        th.sort-desc::after {
            content: " ▼";
            font-size: 0.7em;
        }

        /* Filter Row */
        .filter-row th {
            padding: 5px 15px 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .filter-input {
            width: 100%;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-size: 0.85rem;
            box-sizing: border-box;
        }

        .filter-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* Rows */
        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .amount-debit {
            color: var(--text-primary);
        }
        
        /* Highlight specific columns if needed */
        td:nth-child(5) { font-family: monospace; text-align: right; } /* Debit */
        td:nth-child(6) { font-family: monospace; text-align: right; } /* Credit */
        td:nth-child(7) { font-family: monospace; text-align: right; color: var(--text-secondary); } /* Balance */

        /* Utilities */
        .hidden { display: none !important; }
        
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>Transaction Viewer</h1>
        <div class="metadata" id="metadata-display">Loading metadata...</div>
    </div>
    <div class="controls">
        <input type="file" id="file-upload" accept=".csv" class="hidden">
        <button onclick="document.getElementById('file-upload').click()">Upload New CSV</button>
        <button class="accent-btn" onclick="resetFilters()">Reset Filters</button>

</header>

</div>

// CSV Parser
function parseCSV(text) {
    const lines = text.split('\n');
    const metadata = [];
    let headerLineIndex = -1;

    // Identify header line (starts with "Transaction Number")
    for (let i = 0; i < lines.length; i++) {
        if (lines[i].includes('Transaction Number')) {
            headerLineIndex = i;
            break;
        }
        if (lines[i].trim()) {
            metadata.push(lines[i].trim());
        }
    }

    if (headerLineIndex === -1) return { metadata, headers: [], data: [] };

    // Initial Split Helper for CSV component awareness
    // This is a simple regex for CSV parsing dealing with quotes
    const splitCSVLine = (line) => {
        const result = [];
        let current = '';
        let inQuotes = false;
        
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(current);
                current = '';
            } else {
                current += char;
            }
        }
        result.push(current);
        return result.map(s => s.trim().replace(/^"|"$/g, ''));
    };

    const headers = splitCSVLine(lines[headerLineIndex]);
    const data = [];

    for (let i = headerLineIndex + 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const row = splitCSVLine(line);
        // Ensure row has same number of columns, logical padding
        while(row.length < headers.length) row.push('');
        data.push(row);
    }

    return { metadata, headers, data };
}

// Rendering
function renderTable(dataToRender) {
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';

    dataToRender.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach((cell, idx) => {
            const td = document.createElement('td');
            td.textContent = cell;
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

    theadRow.innerHTML = '';
    filterRow.innerHTML = '';

    headersList.forEach((header, index) => {
        // Header Cell
        const th = document.createElement('th');
        th.textContent = header;
        th.onclick = () => sortTable(index);
        theadRow.appendChild(th);

        // Filter Cell
        const thFilter = document.createElement('th');
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Filter...';
        input.className = 'filter-input';
        input.oninput = filterTable;
        thFilter.appendChild(input);
        filterRow.appendChild(thFilter);
    });
}

function displayMetadata(metadata) {
    const container = document.getElementById('metadata-display');
    if (metadata.length === 0) {
        container.style.display = 'none';
        return;
    }
    container.innerHTML = metadata.join(' &nbsp;|&nbsp; ');
}

// Logic
function loadData(csvText) {
    const result = parseCSV(csvText);
    headers = result.headers;
    allData = result.data;
    
    displayMetadata(result.metadata);
    renderHeaders(headers);
    renderTable(allData);
}

function filterTable() {
    const inputs = document.querySelectorAll('.filter-input');
    const filters = Array.from(inputs).map(input => input.value.toLowerCase());

    const filteredData = allData.filter(row => {
        return row.every((cell, index) => {
            const filterText = filters[index];
            if (!filterText) return true;
            return cell.toLowerCase().includes(filterText);
        });
    });

    // Apply Sort if active on filtered data
    if (sortCol !== -1) {
        sortDataList(filteredData, sortCol, sortAsc);
    }

    renderTable(filteredData);
}

function sortTable(columnIndex) {
    const ths = document.querySelectorAll('#header-row th');
    
    if (sortCol === columnIndex) {
        sortAsc = !sortAsc;
    } else {
        sortCol = columnIndex;
        sortAsc = true;
    }

    // Update UI arrows
    ths.forEach(th => th.className = '');
    ths[columnIndex].className = sortAsc ? 'sort-asc' : 'sort-desc';

    // Re-filter to get current set, then sort it
    filterTable(); 
}

function sortDataList(dataList, colIndex, ascending) {
    dataList.sort((a, b) => {
        let valA = a[colIndex];
        let valB = b[colIndex];

        // Try numeric sort
        const numA = parseFloat(valA.replace(/[^0-9.-]+/g, ''));
        const numB = parseFloat(valB.replace(/[^0-9.-]+/g, ''));

        if (!isNaN(numA) && !isNaN(numB) && valA.length > 0 && valB.length > 0) {
            return ascending ? numA - numB : numB - numA;
        }

        // String sort
        return ascending 
            ? valA.localeCompare(valB)
            : valB.localeCompare(valA);
    });
}

function resetFilters() {
    const inputs = document.querySelectorAll('.filter-input');
    inputs.forEach(input => input.value = '');
    filterTable();
}

// File Upload Handler
document.getElementById('file-upload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
        loadData(event.target.result);
    };
    reader.readAsText(file);
});

// Init
window.addEventListener('DOMContentLoaded', () => {
    loadData(INITIAL_CSV_DATA);
});

</script>
