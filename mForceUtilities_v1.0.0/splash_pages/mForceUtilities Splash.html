            document.getElementById('orb-2').style.background = `radial-gradient(circle, ${hex} 0%, transparent 70%)`;

            // Text & Glows
            document.getElementById('top-glow').classList.add(`from-${colorClass}-500`); // Might fail if not in safelist
            // Use inline styles for reliability
            document.getElementById('top-glow').style.background = `linear-gradient(90deg, transparent, ${hex}, transparent)`;
            document.getElementById('icon-glow').style.backgroundColor = hex;
            document.getElementById('splash-icon').style.color = hex;
            document.getElementById('status-dot').style.backgroundColor = hex;
            document.getElementById('splash-subtitle-container').style.color = hex;

            // Content
            document.getElementById('splash-title').innerText = cfg.title;
            document.getElementById('splash-subtitle').innerText = cfg.subtitle;

            // Icon Path
            
            // Icon Path Update
            if (cfg.iconPath) {
                const svg = document.getElementById('splash-icon');
                svg.innerHTML = `<path d="${cfg.iconPath}"></path>`;
            }
         
            
            
        });

        // AUTH LISTENER
        window.addEventListener('mforce-auth-changed', (e) => {
            if (e.detail.user) {
                // User Logged In -> Fade Out Splash
                const body = document.body;
                document.getElementById('main-card').style.opacity = '0';
                document.getElementById('main-card').style.transform = 'scale(0.9)';
                setTimeout(() => {
                    // Redirect or Hide
                    // If this is an overlay, hide it.
                    // If this is index.html, redirect to app.
                    if (window.APP_URL) window.location.href = window.APP_URL;
                    else {
                        document.querySelector('mforce-launchpad').style.display = 'none'; // Keep toolbar? No, toolbar usually stays
                        // Hide splash container
                        document.getElementById('bg-container').style.display = 'none';
                        document.getElementById('main-card').style.display = 'none';
                    }
                }, 500);
            }
        });
    </script>
