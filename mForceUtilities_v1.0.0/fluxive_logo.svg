<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techGradient" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" /> <!-- White Top -->
      <stop offset="100%" stop-color="#3B82F6" /> <!-- Royal Blue Bottom -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Parentheses with Glow -->
  <g filter="url(#glow)">
    <path d="M110 128C80 160 64 200 64 256C64 312 80 352 110 384" stroke="url(#techGradient)" stroke-width="36" stroke-linecap="round"/>
    <path d="M402 128C432 160 448 200 448 256C448 312 432 352 402 384" stroke="url(#techGradient)" stroke-width="36" stroke-linecap="round"/>
  </g>
  
  <!-- Split Arrow Group with Glow -->
  <g filter="url(#glow)">
     <!-- Right Half: Filled -->
    <path d="M256 150 L346 330 L256 280 Z" fill="url(#techGradient)" stroke="url(#techGradient)" stroke-width="18" stroke-linejoin="round"/>
    
    <!-- Left Half: Transparent (Stroke Only) -->
    <path d="M256 150 L166 330 L256 280 Z" fill="none" stroke="url(#techGradient)" stroke-width="18" stroke-linejoin="round"/>
  </g>
</svg>
